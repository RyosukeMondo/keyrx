[package]
name = "module_splitter"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "parsing", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
regex = "1.10"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"
