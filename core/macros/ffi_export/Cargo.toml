[package]
name = "ffi_export"
version.workspace = true
edition.workspace = true
description = "Procedural macro for deriving FFI contracts from Rust functions"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "parsing", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
trybuild = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
