# Code Metrics Allowlist
#
# This file documents modules that exceed the standard 500-line limit.
# Each entry explains the architectural justification and potential
# refactoring strategies.
#
# Format:
#   file_path:
#     lines: <current_line_count>
#     limit: <allowed_limit>
#     justification: <reason_for_exception>
#     refactoring_strategy: <how_to_split_if_needed>
#     priority: <low|medium|high>

version: 1

exceptions:
  # ========== FFI Marshal Layer ==========

  core/src/ffi/marshal/callback.rs:
    lines: 864
    limit: 900
    justification: >
      Central callback marshaling infrastructure for all FFI domains.
      Contains thread-safe callback registration, invocation, and lifecycle
      management. High cohesion: all code relates to single responsibility
      (callback handling across FFI boundary).
    refactoring_strategy: >
      Split by callback type (event vs. state vs. error callbacks) into
      callback/events.rs, callback/state.rs, callback/errors.rs.
      Requires redesigning registration API to maintain type safety.
    priority: medium
    architectural_notes:
      - Critical path for all async FFI operations
      - Must maintain thread safety guarantees
      - Splitting risks fragmenting safety invariants

  core/src/ffi/marshal/stream.rs:
    lines: 685
    limit: 750
    justification: >
      Stream marshaling for reactive FFI patterns. Handles Stream<T> → callback
      bridging, backpressure, and cancellation semantics. Cohesive module for
      async stream protocol implementation.
    refactoring_strategy: >
      Extract backpressure logic to stream/backpressure.rs, cancellation to
      stream/cancellation.rs. Core stream wrapper stays in stream.rs.
    priority: low
    architectural_notes:
      - Used by observability and device_registry domains
      - Splitting requires careful async lifetime management

  core/src/ffi/marshal/impls/session.rs:
    lines: 636
    limit: 700
    justification: >
      Marshal implementations for all session-related types (SessionInfo,
      RecordingState, ReplayResult, etc.). High coupling: types reference
      each other extensively. Splitting would create circular dependencies.
    refactoring_strategy: >
      Group by operation: session/recording.rs, session/replay.rs,
      session/analysis.rs. Shared types stay in session/common.rs.
    priority: low
    architectural_notes:
      - Types form a coherent domain model
      - Splitting mainly improves navigation, not complexity

  core/src/ffi/marshal/traits.rs:
    lines: 631
    limit: 700
    justification: >
      Core trait definitions for FFI marshaling (FFIResult, FFIEncode,
      FFIDecode). All implementations rely on these traits. Splitting would
      require every client to import multiple modules.
    refactoring_strategy: >
      Extract advanced traits (FFIResultExt, FFIStreamExt) to traits/ext.rs.
      Keep core traits in traits.rs.
    priority: low
    architectural_notes:
      - Fundamental abstraction for entire FFI layer
      - Prefer keeping cohesive over arbitrary splitting

  core/src/ffi/marshal/error.rs:
    lines: 623
    limit: 700
    justification: >
      Comprehensive error marshaling with domain-specific error variants,
      mapping from Rust errors to C-compatible error codes, and detailed
      error context preservation. All error handling logic is interrelated.
    refactoring_strategy: >
      Split domain errors to error/domains.rs, keep core error types and
      marshaling in error.rs.
    priority: low
    architectural_notes:
      - Error representation must be consistent across FFI
      - Premature splitting creates import noise

  core/src/ffi/marshal/result.rs:
    lines: 576
    limit: 650
    justification: >
      Result marshaling with Option<T>, Result<T, E>, and Stream<Result<T, E>>
      handling. Contains optimization for zero-copy success paths. Logic is
      tightly coupled to minimize allocation overhead.
    refactoring_strategy: >
      Extract async result handling to result/async.rs, keep sync paths in
      result.rs.
    priority: low
    architectural_notes:
      - Performance-critical code path
      - Splitting may obscure optimization opportunities

  # ========== FFI Domain Implementations ==========

  core/src/ffi/domains/observability.rs:
    lines: 853
    limit: 900
    justification: >
      Complete observability domain: tracing subscriber setup, metrics
      collection, log forwarding, and telemetry export. All observability
      concerns are intentionally co-located for operational clarity.
    refactoring_strategy: >
      Split into observability/{tracing,metrics,logging}.rs by telemetry type.
      Requires shared observability/config.rs for initialization coordination.
    priority: medium
    architectural_notes:
      - Operational requirement: single point of observability config
      - Splitting improves modularity but risks lifecycle bugs

  core/src/ffi/domains/profile_registry.rs:
    lines: 723
    limit: 800
    justification: >
      Profile registry CRUD operations, validation, compatibility checks,
      and migration logic. Domain logic is highly cohesive: all operations
      manipulate the same registry state.
    refactoring_strategy: >
      Extract validation to profile_registry/validation.rs, migration to
      profile_registry/migration.rs. CRUD stays in profile_registry/core.rs.
    priority: medium
    architectural_notes:
      - Registry lock synchronization is complex
      - Splitting must preserve transaction semantics

  core/src/ffi/domains/device_registry.rs:
    lines: 584
    limit: 650
    justification: >
      Device registry management: device discovery, state tracking, profile
      assignment, and remap control. All operations share device registry state.
    refactoring_strategy: >
      Extract discovery to device_registry/discovery.rs, keep CRUD in
      device_registry/core.rs.
    priority: low
    architectural_notes:
      - State synchronization with hardware layer is delicate
      - Prefer cohesion over arbitrary size limit

  # ========== FFI Infrastructure ==========

  core/src/ffi/exports_compat.rs:
    lines: 736
    limit: 800
    justification: >
      Compatibility shims for legacy FFI export format (V1 API). Required for
      backward compatibility during migration period. Temporary allowance:
      to be removed after V2 migration completes.
    refactoring_strategy: >
      Delete entire file once V1 clients are fully migrated to V2 API.
      Target: Q2 2026.
    priority: high
    architectural_notes:
      - Technical debt: deprecation planned
      - Do not refactor, delete when ready

  core/src/ffi/tracing_export.rs:
    lines: 646
    limit: 700
    justification: >
      Tracing integration for FFI boundary: span creation, event emission,
      and trace context propagation. All tracing instrumentation is centralized
      for consistent observability across FFI calls.
    refactoring_strategy: >
      Extract span utilities to tracing_export/spans.rs, event formatting to
      tracing_export/events.rs. Keep core subscriber in tracing_export.rs.
    priority: low
    architectural_notes:
      - Critical for production debugging
      - Splitting may obscure trace correlation

  core/src/ffi/contract.rs:
    lines: 612
    limit: 700
    justification: >
      FFI contract schema definitions for all domains. Contains type signatures,
      version metadata, and compatibility checks. Cohesive: all contract
      definitions must be validated together for version compatibility.
    refactoring_strategy: >
      Split by domain: contract/{engine,session,device}.rs. Shared validation
      stays in contract/validation.rs.
    priority: medium
    architectural_notes:
      - Schema evolution requires coordinated changes
      - Splitting improves organization for large domains

  core/src/ffi/events.rs:
    lines: 529
    limit: 600
    justification: >
      Event type definitions and serialization for all FFI event callbacks
      (raw input, raw output, state changes). Event schema must be consistent.
    refactoring_strategy: >
      Extract event serialization to events/serde.rs, keep type definitions
      in events.rs.
    priority: low
    architectural_notes:
      - Event schema stability is critical for clients
      - Minor overage, refactoring not urgent

  # ========== Test Infrastructure ==========

  core/src/ffi/tests/parallel_tests.rs:
    lines: 587
    limit: 650
    justification: >
      Comprehensive parallel FFI test suite. Contains setup, teardown, and
      test cases for thread-safety verification. Test cohesion is intentional:
      all parallel safety tests must run in same process.
    refactoring_strategy: >
      Split by test category: parallel_tests/{callback,stream,state}.rs.
      Shared test harness stays in parallel_tests/harness.rs.
    priority: low
    architectural_notes:
      - Test file size limits are less critical than production code
      - Prefer test cohesion over arbitrary splitting

# ========== Allowlist Summary ==========

summary:
  total_exceptions: 14
  total_excess_lines: 3451  # Sum of (actual - 500) for all files
  average_overage: 246 lines per file

  priority_breakdown:
    high: 1   # exports_compat.rs (delete when ready)
    medium: 4  # Refactor within 2-3 sprints
    low: 9     # Refactor opportunistically

  refactoring_effort_estimate:
    high_priority: 0 hours (delete, don't refactor)
    medium_priority: 16-24 hours (4 files × 4-6 hours each)
    low_priority: 36-54 hours (9 files × 4-6 hours each)
    total: 52-78 hours (~2-3 weeks engineering time)

# ========== Enforcement Policy ==========

enforcement:
  new_files: >
    All new files MUST adhere to 500-line limit unless approved in this allowlist.
    Approval requires architectural review and documented justification.

  existing_files: >
    Files in this allowlist may remain above 500 lines, but should not grow
    further without review. Prefer refactoring over increasing allowlist limits.

  review_frequency: >
    Allowlist reviewed quarterly. Priority-medium items should be addressed
    within 6 months. Priority-low items are acceptable long-term.

# ========== Notes ==========

notes:
  - All line counts exclude comments and blank lines (matches CLAUDE.md metrics)
  - Limits set at 10-15% above current size to allow minor growth
  - Refactoring strategies preserve existing test coverage requirements
  - Priority considers: churn rate, complexity, team familiarity, business value
