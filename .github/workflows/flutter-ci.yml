name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: '3.x'
  COVERAGE_THRESHOLD: 80
  CONCURRENCY: 4
  EXCLUDE_TAGS: slow,integration
  TEST_RANDOM_SEED: random

jobs:
  flutter-lint:
    name: Flutter Lint (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./ui

      - name: Verify FFI bindings
        run: python3 scripts/verify/bindings.py

      - name: Flutter analyze (fatal warnings)
        run: flutter analyze --fatal-infos --fatal-warnings
        working-directory: ./ui

  flutter-metrics:
    name: Flutter Metrics (size limits)
    needs: flutter-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./ui

      - name: Code metrics check (500 lines/file, 50 lines/function)
        run: dart run scripts/check_metrics.dart
        working-directory: ./ui

  flutter-coverage:
    name: Flutter Coverage (>=${{ env.COVERAGE_THRESHOLD }}%)
    needs: flutter-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./ui

      - name: Tests with coverage and threshold
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
          CONCURRENCY: ${{ env.CONCURRENCY }}
          EXCLUDE_TAGS: ${{ env.EXCLUDE_TAGS }}
          TEST_RANDOM_SEED: ${{ env.TEST_RANDOM_SEED }}
        run: bash scripts/check_coverage.sh
        working-directory: ./ui

      - name: Upload Flutter coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./ui/coverage/lcov.info
          flags: flutter
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Save coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: ui/coverage/lcov.info

  flutter-golden:
    name: Flutter Golden Tests
    needs: flutter-metrics
    runs-on: ubuntu-latest
    env:
      CONCURRENCY: 2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./ui

      - name: Golden test verification
        run: flutter test --concurrency=${CONCURRENCY} test/widgets/golden
        working-directory: ./ui

  flutter-e2e-desktop:
    name: Flutter E2E Tests (Desktop)
    needs: flutter-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config cmake ninja-build libblkid-dev

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./ui

      - name: Run desktop E2E tests
        run: flutter test test_driver/web_platform_test.dart
        working-directory: ./ui

  flutter-e2e-web:
    name: Flutter E2E Tests (Web)
    needs: flutter-metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./ui

      - name: Install Chrome for web testing
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run web E2E tests
        run: flutter test --platform chrome test_driver/web_platform_test.dart
        working-directory: ./ui
        env:
          BACKEND_URL: http://localhost:8080

  flutter-quality-gates:
    name: Flutter Quality Gates
    if: ${{ always() }}
    needs: [flutter-lint, flutter-metrics, flutter-coverage, flutter-golden, flutter-e2e-desktop, flutter-e2e-web]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize gate results
        run: |
          declare -A results=(
            [lint]="${{ needs.flutter-lint.result }}"
            [metrics]="${{ needs.flutter-metrics.result }}"
            [coverage]="${{ needs.flutter-coverage.result }}"
            [golden]="${{ needs.flutter-golden.result }}"
            [e2e-desktop]="${{ needs.flutter-e2e-desktop.result }}"
            [e2e-web]="${{ needs.flutter-e2e-web.result }}"
          )

          failed=0
          for gate in "${!results[@]}"; do
            echo "Gate '${gate}' result: ${results[$gate]}"
            if [[ "${results[$gate]}" != "success" ]]; then
              failed=1
            fi
          done

          if [[ $failed -ne 0 ]]; then
            echo "::error::One or more quality gates failed. See upstream job logs for details."
            exit 1
          fi
          echo "All Flutter quality gates passed."
